name: Keep Supabase awake

# Supabase pauses a free-tier project after 7 consecutive days without activity, and a
# paused project returns errors until someone restores it by hand from the dashboard.
# For a portfolio piece that is exactly the failure mode that matters: it works when you
# build it and is broken the week a recruiter opens it.
#
# A weekly read is enough to reset the timer. Wednesdays, so a failure has the rest of
# the week to be noticed.
on:
  schedule:
    - cron: "17 6 * * 3"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Set the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets."
            exit 1
          fi

          # Hitting PostgREST's root reaches the database itself rather than just the
          # edge, which is what the inactivity timer actually measures.
          status=$(curl -s -o /tmp/body -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/")

          echo "PostgREST responded $status"
          if [ "$status" -ge 400 ]; then
            echo "::error::Unexpected response $status"
            head -c 500 /tmp/body
            exit 1
          fi
